name: CodeQL

# Code scanning for the main ruleset's code_scanning rule: every PR and every push to main
# uploads a CodeQL analysis for Go, Python and the workflows themselves, and a high or
# higher alert blocks the merge.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Build Go
        run: go build ./go/...
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

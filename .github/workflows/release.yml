name: Release

# A merge to main releases whatever is new; nobody pushes a release tag by hand.
#   - Go: when CHANGELOG.md's newest "## [X.Y.Z]" section has no "vX.Y.Z" tag, the merge commit is
#     tagged vX.Y.Z (the Go module version) and its GitHub release is created from that section.
#   - Python: when python/techai_webutils/pyproject.toml's version has no
#     "techai-webutils-vX.Y.Z" tag, the package is published to PyPI, then tagged and released.
# scripts/release.sh holds the logic; CI runs `scripts/release.sh check` on every PR so a merge
# can never re-release or go backwards. A run with nothing new is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick merges cannot race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish Go and Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Configure the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: scripts/release.sh release
